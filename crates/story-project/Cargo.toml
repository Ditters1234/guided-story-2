[package]
name = "story-project"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
